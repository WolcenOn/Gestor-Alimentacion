name: Classify pack meal types

on:
  push:
    branches:
      - agent/ux-simplification
    paths:
      - "scripts/classify-pack-meal-types.mjs"
      - ".github/workflows/classify-pack-meal-types.yml"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ux-simplification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify recipes
        run: node scripts/classify-pack-meal-types.mjs

      - name: Commit rewritten packs
        shell: bash
        run: |
          if git diff --quiet -- packs; then
            echo "No pack changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs
          git commit -m "Classify legacy pack recipes by meal type"
          git push origin HEAD:agent/ux-simplification
