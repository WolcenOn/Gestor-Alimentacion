name: CI

on:
  push:
    branches:
      - main
      - fusion-glucosatrack-planificador
      - stabilization-week-1-production-readiness
  pull_request:

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run frontend tests
        run: npm test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestor_alimentacion_test
          POSTGRES_USER: gestor_test
          POSTGRES_PASSWORD: gestor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor_test -d gestor_alimentacion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gestor_test:gestor_test@localhost:5432/gestor_alimentacion_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run backend tests
        run: go test ./...
