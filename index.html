<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Menú Semanal">
  <title>Gestor de Menú Semanal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Saltar al contenido</a>

  <header class="app-header app-screen">
    <div>
      <p class="eyebrow">MVP familiar</p>
      <h1>Gestor de Menú Semanal</h1>
      <p class="muted">Planifica, compra, actualiza stock e imprime solo lo necesario.</p>
    </div>
    <div class="header-actions">
      <button class="secondary" data-action="export-data">Exportar JSON</button>
      <label class="button secondary file-button">
        Importar JSON
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </label>
    </div>
  </header>

  <nav class="tabs app-screen" aria-label="Secciones principales">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="ingredients">Ingredientes</button>
    <button data-tab="dishes">Platos</button>
    <button data-tab="calendar">Semana</button>
    <button data-tab="shopping">Compra</button>
    <button data-tab="packs">Packs</button>
    <button data-tab="nutrition">Nutrición</button>
    <button data-tab="metabolic">Metabólico</button>
    <button data-tab="settings">Ajustes</button>
    <button data-tab="help">Ayuda</button>
  </nav>

  <main id="mainContent" class="app-shell app-screen" tabindex="-1">
    <section id="alerts" class="alerts" aria-live="polite"></section>
    <section id="viewRoot"></section>
  </main>

  <div id="modalRoot" class="modal-root app-screen" aria-live="polite"></div>
  <div id="printShoppingView" class="print-view"></div>
  <div id="printWeekView" class="print-view"></div>

  <script src="app/config.js"></script>
  <script type="module" src="app/apiClient.js"></script>
  <script type="module" src="app/backendHealthBadge.js"></script>
  <script type="module" src="app/cloudHouseholdEnhancements.js"></script>
  <script type="module" src="app/cloudSync.js"></script>
  <script type="module" src="app/cloudMembers.js"></script>
  <script type="module" src="app/cloudSessionGuard.js"></script>
  <script type="module" src="app/glucosaTrackFusionBootstrap.js"></script>
  <script type="module" src="app/glucosaTrackFusionProfile.js"></script>
  <script type="module" src="app/metabolicPremiumModule.js"></script>
  <script type="module" src="app/packEnhancements.js"></script>
  <script type="module" src="app/main.js"></script>
  <script type="module" src="app/detailCards.js"></script>
  <script type="module" src="app/dishPickerEnhancements.js"></script>
  <script type="module" src="app/foodTranslationEnhancements.js"></script>
  <script type="module" src="app/mainActionsBootstrap.js"></script>
  <script type="module" src="app/searchEnhancements.js"></script>
  <script type="module" src="app/purchaseScanEnhancements.js"></script>
  <script type="module" src="app/ingredientEnhancements.js"></script>
  <script type="module" src="app/trustedIngredientEnhancements.js"></script>
  <script type="module" src="app/ingredientFastPurchaseEnhancements.js"></script>
  <script type="module" src="app/manualNutritionEnhancements.js"></script>
  <script type="module" src="app/calendarEnhancements.js"></script>
  <script type="module" src="app/mealConsumptionEnhancements.js"></script>
  <script type="module" src="app/nutritionCurveEnhancements.js"></script>
  <script type="module" src="app/nutritionBatchEnhancements.js"></script>
  <script type="module" src="app/dishEnhancements.js"></script>
  <script type="module" src="app/pwaRegister.js"></script>
</body>
</html>
