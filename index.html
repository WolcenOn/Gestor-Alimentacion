      </div>
      <div class="side-menu-section">

          <label class="button secondary side-menu-file" data-side-menu-item>
            Importar JSON
            <input id="importFile" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
      <div class="side-menu-section">
        <p class="side-menu-section-title">Legal y estado</p>

          <button type="button" id="backendHealthBadge" data-side-menu-item>Comprobar backend</button>
        </div>
      </div>
