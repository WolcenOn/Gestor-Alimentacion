  <a class="skip-link" href="#mainContent">Saltar al contenido</a>

  <header class="app-header app-screen simplified-header ux-header">
    <div class="ux-brand-block">
      <h1>Mi menú</h1>
      <p class="muted">Planifica, compra y cocina sin perder de vista lo importante.</p>
    </div>
    <div class="header-actions ux-header-status">
      <span id="uxSyncStatus" class="ux-sync-status" data-mode="local" aria-live="polite">Solo en este dispositivo</span>
      <button class="secondary menu-trigger" data-action="open-side-menu" aria-controls="sideMenu" aria-expanded="false" aria-label="Abrir más opciones">☰</button>
    </div>
  </header>

  <aside id="sideMenu" class="side-menu app-screen" aria-hidden="true">
    <button type="button" class="side-menu-backdrop" data-action="close-side-menu" aria-label="Cerrar menú"></button>
    <section class="side-menu-panel" role="dialog" aria-modal="true" aria-labelledby="sideMenuTitle">
      <header class="side-menu-header">
        <div>
          <p class="eyebrow">Más</p>
          <h2 id="sideMenuTitle">Opciones</h2>
          <p class="muted">Recetas, salud, ajustes y herramientas menos frecuentes.</p>
        </div>
        <button type="button" class="secondary" data-action="close-side-menu" aria-label="Cerrar">×</button>
      </header>

      <div class="side-menu-section">
        <p class="side-menu-section-title">Tu alimentación</p>
        <div class="side-menu-list">
          <button type="button" data-tab="dishes" data-side-menu-item>Recetas y platos</button>
          <button type="button" data-tab="nutrition" data-side-menu-item>Nutrición</button>
          <button type="button" data-tab="metabolic" data-side-menu-item>Salud metabólica</button>
          <button type="button" data-tab="packs" data-side-menu-item>Colecciones de recetas</button>
        </div>
      </div>

      <div class="side-menu-section">
        <p class="side-menu-section-title">Cuenta y aplicación</p>
        <div class="side-menu-list">
          <button type="button" data-tab="settings" data-side-menu-item>Ajustes y sincronización</button>
          <button type="button" data-tab="help" data-side-menu-item>Ayuda</button>
        </div>
      </div>

      <div class="side-menu-section ux-advanced-section">
        <details>
          <summary>Datos y opciones avanzadas</summary>
          <div class="side-menu-list">
            <button type="button" data-action="create-snapshot" data-side-menu-item>Crear copia de seguridad</button>
            <button type="button" data-action="export-data" data-side-menu-item>Descargar datos</button>
            <label class="button secondary side-menu-file" data-side-menu-item>
              Importar datos
              <input id="importFile" type="file" accept="application/json,.json" hidden>
            </label>
            <button type="button" id="backendHealthBadge" data-side-menu-item>Estado del servicio</button>
          </div>
        </details>
      </div>

      <div class="side-menu-section ux-advanced-section">
        <details>
          <summary>Privacidad y condiciones</summary>
          <div class="side-menu-list">
            <button type="button" data-action="open-legal-doc" data-legal-doc="privacy" data-side-menu-item>Privacidad</button>
            <button type="button" data-action="open-legal-doc" data-legal-doc="terms" data-side-menu-item>Términos de servicio</button>
          </div>
        </details>
      </div>
    </section>
  </aside>

  <main id="mainContent" class="app-shell app-screen" tabindex="-1">
    <section id="alerts" class="alerts" aria-live="polite"></section>
    <section id="viewRoot"></section>
  </main>

  <nav class="ux-bottom-nav app-screen" aria-label="Navegación principal">
    <button type="button" data-tab="dashboard"><span class="ux-nav-icon" aria-hidden="true">🏠</span><span>Hoy</span></button>
    <button type="button" data-tab="calendar"><span class="ux-nav-icon" aria-hidden="true">📅</span><span>Semana</span></button>
    <button type="button" data-tab="shopping"><span class="ux-nav-icon" aria-hidden="true">🛒</span><span>Compra</span></button>
    <button type="button" data-tab="ingredients"><span class="ux-nav-icon" aria-hidden="true">🥕</span><span>Despensa</span></button>
    <button type="button" data-action="open-side-menu" aria-controls="sideMenu"><span class="ux-nav-icon" aria-hidden="true">•••</span><span>Más</span></button>
  </nav>
